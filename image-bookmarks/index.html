<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像検索ブックマーク</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
      letter-spacing: 0.05em;
    }
    .toolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      font-size: 0.8rem;
      color: #aaa;
    }
    .toolbar button {
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #e0e0e0;
      padding: 8px 12px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .toolbar button[aria-pressed="true"] {
      border-color: #4a90e2;
      color: #fff;
    }
    .section {
      margin-bottom: 28px;
    }
    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 10px;
      border-left: 3px solid #555;
      padding-left: 8px;
    }
    .section-title .count {
      margin-left: 8px;
      color: #666;
      letter-spacing: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
    }
    .card {
      display: flex;
      align-items: stretch;
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      overflow: hidden;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .card:hover {
      background: #2a2a2a;
      border-color: #4a90e2;
    }
    .card.checked {
      opacity: 0.45;
    }
    .card a {
      flex: 1;
      display: block;
      padding: 12px 6px 12px 14px;
      color: #e0e0e0;
      text-decoration: none;
      font-size: 0.85rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .card a:hover, .card a:active {
      color: #fff;
    }
    .card .icon {
      font-size: 1rem;
      margin-bottom: 4px;
      display: block;
    }
    .card label {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      width: 44px;
      padding-top: 10px;
      cursor: pointer;
    }
    .card input {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
    .hidden { display: none; }
    .error { text-align: center; color: #888; font-size: 0.85rem; }
  </style>
</head>
<body>

<h1 id="title">🔍 画像検索ブックマーク</h1>
<div class="toolbar">
  <span id="total"></span>
  <button id="filter" type="button" aria-pressed="false">未チェックだけ表示</button>
</div>
<div id="root"></div>

<p style="text-align:center;color:#555;font-size:0.7rem;margin-top:32px;">タップで Google 画像検索が開きます／右のチェックは、この端末のブラウザに保存されます</p>

<script>
  var CHECK_KEY = 'imgbm-checked';
  var FILTER_KEY = 'imgbm-unchecked-only';

  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  var checked = {};
  load(CHECK_KEY, []).forEach(function (n) { checked[n] = true; });
  var unCheckedOnly = load(FILTER_KEY, false) === true;

  var sectionViews = [];
  var filterBtn = document.getElementById('filter');

  function render(data) {
    var root = document.getElementById('root');
    data.sections.forEach(function (sec) {
      var wrap = document.createElement('div');
      wrap.className = 'section';

      var title = document.createElement('div');
      title.className = 'section-title';
      var titleText = document.createElement('span');
      titleText.textContent = sec.title;
      var count = document.createElement('span');
      count.className = 'count';
      title.appendChild(titleText);
      title.appendChild(count);
      wrap.appendChild(title);

      var grid = document.createElement('div');
      grid.className = 'grid';
      var cards = [];

      sec.items.forEach(function (item) {
        var card = document.createElement('div');
        card.className = 'card';

        var a = document.createElement('a');
        a.href = 'https://www.google.com/search?q=' + encodeURIComponent(item.q || item.name) + '&tbm=isch';
        a.target = '_blank';
        a.rel = 'noopener';
        var icon = item.icon || sec.icon;
        if (icon) {
          var iconEl = document.createElement('span');
          iconEl.className = 'icon';
          iconEl.textContent = icon;
          a.appendChild(iconEl);
        }
        a.appendChild(document.createTextNode(item.name));

        var label = document.createElement('label');
        var box = document.createElement('input');
        box.type = 'checkbox';
        box.setAttribute('aria-label', item.name + ' をチェック');
        box.checked = !!checked[item.name];
        box.addEventListener('change', function () {
          if (box.checked) checked[item.name] = true; else delete checked[item.name];
          save(CHECK_KEY, Object.keys(checked));
          refresh();
        });
        label.appendChild(box);

        card.appendChild(a);
        card.appendChild(label);
        grid.appendChild(card);
        cards.push({ el: card, name: item.name });
      });

      wrap.appendChild(grid);
      root.appendChild(wrap);
      sectionViews.push({ wrap: wrap, count: count, cards: cards });
    });
    refresh();
  }

  function refresh() {
    var done = 0, all = 0;
    sectionViews.forEach(function (sv) {
      var secDone = 0, secVisible = 0;
      sv.cards.forEach(function (c) {
        var isChecked = !!checked[c.name];
        c.el.classList.toggle('checked', isChecked);
        c.el.classList.toggle('hidden', unCheckedOnly && isChecked);
        if (isChecked) secDone++;
        if (!(unCheckedOnly && isChecked)) secVisible++;
      });
      sv.count.textContent = secDone + '/' + sv.cards.length;
      sv.wrap.classList.toggle('hidden', secVisible === 0);
      done += secDone;
      all += sv.cards.length;
    });
    document.getElementById('total').textContent = 'チェック済み ' + done + '/' + all;
    filterBtn.setAttribute('aria-pressed', unCheckedOnly ? 'true' : 'false');
  }

  filterBtn.addEventListener('click', function () {
    unCheckedOnly = !unCheckedOnly;
    save(FILTER_KEY, unCheckedOnly);
    refresh();
  });

  fetch('bookmarks.json')
    .then(function (res) {
      if (!res.ok) throw new Error(res.status);
      return res.json();
    })
    .then(render)
    .catch(function () {
      var p = document.createElement('p');
      p.className = 'error';
      p.textContent = 'ブックマークを読み込めませんでした。';
      document.getElementById('root').appendChild(p);
    });
</script>

</body>
</html>
